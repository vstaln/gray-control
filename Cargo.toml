[package]
name = "gray-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Per-session remote control: unix socket JSON-RPC (send/status/stop) + send_to_session tool"

[[bin]]
name = "gray-control"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
