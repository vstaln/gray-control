[package]
name = "gray-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Per-session remote control: unix socket JSON-RPC (send/status/stop) + send_to_session tool"

[[bin]]
name = "gray-control"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
